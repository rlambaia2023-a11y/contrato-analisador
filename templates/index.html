<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Analyser de Contrato Médico</title>
    <style>
        body {font-family: Arial, sans-serif; margin: 2rem;}
        .container {max-width: 600px; margin: auto;}
        h1 {text-align: center;}
        .upload {border: 2px dashed #aaa; padding: 2rem; text-align: center;}
        input[type=file] {margin: 1rem 0;}
        button {padding: 0.5rem 1rem; font-size: 1rem;}
    </style>
</head>
<body>
<div class="container">
    <h1>Analisador de Contrato Médico & Hospitalar</h1>
    <form class="upload" method="post" enctype="multipart/form-data">
        <p>Selecione um contrato em PDF:</p>
        <input type="file" name="contract" accept="application/pdf" required>
        <br>
        <button type="submit">Enviar e Analisar</button>
    </form>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul style="color:red;">
          {% for msg in messages %}<li>{{ msg }}</li>{% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
</div>
</body>
</html>
